
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Leitor de QR Code - FATIPI</title>

<style>
:root {
  --bg: #0f1115;
  --card: #1a1d24;
  --text: #f2f4f8;
  --muted: #9aa3b2;
  --accent: #4f8cff;
  --ok: #2ecc71;
  --warning: #f5a623;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
    Roboto, Helvetica, Arial, sans-serif;
}

body {
  padding-bottom: env(safe-area-inset-bottom);
}

.wrap {
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
  padding: 16px;
}

h1 {
  font-size: 20px;
  margin: 4px 0;
}

p.sub {
  color: var(--muted);
  margin: 0 0 14px;
  font-size: 14px;
}

.scanner {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  background: #000;
  border-radius: 18px;
  overflow: hidden;
}

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.frame {
  position: absolute;
  inset: 12%;
  border: 3px solid rgba(255,255,255,.88);
  border-radius: 16px;
  box-shadow: 0 0 0 999px rgba(0,0,0,.35);
  pointer-events: none;
}

.frame::after {
  content: "";
  position: absolute;
  left: 6%;
  right: 6%;
  top: 8%;
  height: 2px;
  background: var(--accent);
  animation: scan 2s ease-in-out infinite;
}

@keyframes scan {
  0%, 100% { top: 8%; }
  50% { top: 92%; }
}

.status {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 12px;
  font-size: 13px;
  background: linear-gradient(transparent, rgba(0,0,0,.85));
  text-align: center;
  z-index: 2;
}

.overlay {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  gap: 12px;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px;
  background: rgba(15,17,21,.95);
  z-index: 5;
}

.overlay.show {
  display: flex;
}

.overlay p {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.45;
}

button {
  font: inherit;
  border: 0;
  border-radius: 12px;
  padding: 12px 18px;
  cursor: pointer;
  background: var(--accent);
  color: #fff;
  font-weight: 600;
}

button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

button.ghost {
  background: transparent;
  color: var(--text);
  border: 1px solid #3a4250;
}

button.small {
  padding: 8px 12px;
  font-size: 13px;
}

.actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.actions button {
  flex: 1;
}

h2 {
  font-size: 16px;
  margin: 22px 0 10px;
}

.item {
  background: var(--card);
  border-radius: 14px;
  padding: 12px 14px;
  margin-bottom: 10px;
  display: flex;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
}

.item b {
  display: block;
  font-size: 15px;
  margin-bottom: 3px;
}

.item span {
  color: var(--muted);
  font-size: 12px;
  word-break: break-all;
}

.item > div {
  min-width: 0;
}

.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.68);
  display: none;
  align-items: flex-end;
  justify-content: center;
  z-index: 50;
  padding: 12px;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
}

.modal-bg.show {
  display: flex;
  animation: fade .2s;
}

.modal {
  width: 100%;
  max-width: 480px;
  background: var(--card);
  border-radius: 22px;
  padding: 22px;
  animation: up .25s ease-out;
}

.modal .tag {
  display: inline-block;
  font-size: 11px;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--ok);
  margin-bottom: 6px;
}

.modal .tag.warn {
  color: var(--warning);
}

.modal h3 {
  margin: 0 0 8px;
  font-size: 20px;
}

.modal p {
  margin: 0 0 18px;
  color: #cfd5e0;
  line-height: 1.5;
  font-size: 15px;
  word-break: break-word;
}

.modal .row {
  display: flex;
  gap: 10px;
}

.modal .row button {
  flex: 1;
}

.qrbox {
  background: #fff;
  padding: 14px;
  border-radius: 14px;
  display: flex;
  justify-content: center;
  margin-bottom: 16px;
}

.qrbox img, .qrbox canvas {
  max-width: 100%;
  height: auto;
}

@keyframes fade {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes up {
  from {
    transform: translateY(30px);
    opacity: 0;
  }
  to {
    transform: none;
    opacity: 1;
  }
}
</style>
</head>

<body>

<main class="wrap">

  <h1>Leitor de QR Code</h1>
  <p class="sub">Aponte a câmera para o QR Code da FATIPI.</p>

  <div class="scanner">

    <video id="video" playsinline muted autoplay></video>

    <div class="frame"></div>

    <div class="status" id="status">
      Preparando leitor...
    </div>

    <div class="overlay" id="overlay">

      <strong id="overlayTitle">Câmera desativada</strong>

      <p id="overlayMsg">
        Toque no botão para ativar a câmera.
      </p>

      <button id="btnStart" type="button">
        Ativar câmera
      </button>

    </div>

  </div>

  <div class="actions">

    <button class="ghost" id="btnSwitch" type="button">
      Trocar câmera
    </button>

    <button class="ghost" id="btnStop" type="button">
      Parar câmera
    </button>

  </div>

  <canvas id="canvas" hidden></canvas>

  <h2>QR Code cadastrado</h2>

  <div id="list"></div>

</main>

<!-- JANELA DE RESULTADO -->

<div class="modal-bg" id="modalBg">

  <div class="modal" role="dialog"
       aria-modal="true" aria-labelledby="mTitle">

    <div class="tag" id="mTag">
      QR Code lido
    </div>

    <h3 id="mTitle"></h3>

    <div id="mQr" class="qrbox" style="display:none"></div>

    <p id="mDesc"></p>

    <div class="row">

      <button class="ghost" id="mClose" type="button">
        Fechar
      </button>

      <button id="mOpen" type="button">
        Abrir site da FATIPI
      </button>

    </div>

  </div>

</div>

<!-- BIBLIOTECAS -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
"use strict";

/* =========================================
   1. CADASTRO DO SITE
========================================= */

const ITEMS = [

  {
    id: "fatipi",
    titulo: "FATIPI",

    descricao:
      "Bem-vindo ao site oficial da Faculdade de Teologia da Igreja Presbiteriana Independente do Brasil.",

    url: "https://www.fatipi.edu.br/"

  }

];


/* =========================================
   2. ELEMENTOS
========================================= */

const $ = id => document.getElementById(id);

const video = $("video");
const canvas = $("canvas");

const ctx = canvas.getContext("2d", {
  willReadFrequently: true
});

let stream = null;
let scanning = false;
let animationId = null;
let modalOpen = false;

let lastCode = "";
let lastTime = 0;
let lastFrameTime = 0;

let currentLink = null;
let facingMode = "environment";


/* =========================================
   3. NORMALIZAÇÃO DO QR CODE
========================================= */

function norm(value) {

  return String(value)
    .trim()
    .toLowerCase()
    .replace(/\/+$/, "");

}


function isFatipiUrl(text) {

  try {

    let value = String(text).trim();

    if (!/^https?:\/\//i.test(value)) {
      value = "https://" + value;
    }

    const url = new URL(value);

    return (
      url.hostname === "fatipi.edu.br" ||
      url.hostname.endsWith(".fatipi.edu.br")
    );

  } catch (error) {

    return false;

  }

}


function findItem(text) {

  const value = norm(text);

  return ITEMS.find(item => {

    return (
      norm(item.url) === value ||
      norm(item.id) === value
    );

  }) || (isFatipiUrl(text) ? ITEMS[0] : null);

}


/* =========================================
   4. MENSAGENS E SOBREPOSIÇÃO
========================================= */

function setStatus(message) {

  $("status").textContent = message;

}


function showOverlay(title, message, buttonLabel) {

  $("overlayTitle").textContent = title;

  $("overlayMsg").textContent = message;

  $("btnStart").textContent =
    buttonLabel || "Ativar câmera";

  $("overlay").classList.add("show");

}


function hideOverlay() {

  $("overlay").classList.remove("show");

}


/* =========================================
   5. INICIAR CÂMERA
========================================= */

async function startCamera() {

  if (stream) return;

  if (!navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia) {

    showOverlay(
      "Câmera indisponível",
      "Seu navegador não permite acesso à câmera neste endereço. Abra o site diretamente em HTTPS.",
      "Tentar novamente"
    );

    return;

  }

  if (typeof window.jsQR !== "function") {

    showOverlay(
      "Leitor não carregado",
      "A biblioteca jsQR não foi carregada. Verifique sua conexão com a internet e atualize a página.",
      "Tentar novamente"
    );

    setStatus("Biblioteca indisponível");

    return;

  }

  try {

    setStatus("Solicitando acesso à câmera...");

    stream = await navigator.mediaDevices.getUserMedia({

      audio: false,

      video: {

        facingMode: {
          ideal: facingMode
        },

        width: {
          ideal: 1920
        },

        height: {
          ideal: 1080
        }

      }

    });

    video.srcObject = stream;

    video.setAttribute("playsinline", "true");

    await video.play();

    hideOverlay();

    scanning = true;

    lastFrameTime = 0;

    setStatus("Procurando QR Code...");

    if (animationId !== null) {
      cancelAnimationFrame(animationId);
    }

    animationId = requestAnimationFrame(tick);

  } catch (error) {

    console.error("Erro ao iniciar câmera:", error);

    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }

    let message =
      "Não foi possível abrir a câmera. Verifique as permissões do navegador.";

    if (error.name === "NotAllowedError") {

      message =
        "Permissão negada. Autorize o acesso à câmera nas configurações do navegador.";

    } else if (error.name === "NotFoundError") {

      message =
        "Nenhuma câmera foi encontrada neste dispositivo.";

    } else if (error.name === "NotReadableError") {

      message =
        "A câmera está sendo utilizada por outro aplicativo.";

    } else if (error.name === "OverconstrainedError") {

      message =
        "Não foi possível utilizar a configuração solicitada para a câmera.";

    }

    scanning = false;

    showOverlay(
      "Câmera desativada",
      message,
      "Tentar novamente"
    );

    setStatus("Câmera indisponível");

  }

}


/* =========================================
   6. PARAR CÂMERA
========================================= */

function stopCamera() {

  scanning = false;

  if (animationId !== null) {

    cancelAnimationFrame(animationId);

    animationId = null;

  }

  if (stream) {

    stream.getTracks().forEach(track => track.stop());

    stream = null;

  }

  video.srcObject = null;

  setStatus("Câmera parada");

}


/* =========================================
   7. LEITURA DO QR CODE
========================================= */

function tick(timestamp) {

  if (!scanning) return;

  try {

    if (
      !modalOpen &&
      video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA &&
      video.videoWidth > 0 &&
      timestamp - lastFrameTime >= 100
    ) {

      lastFrameTime = timestamp;

      /*
       * Aumenta a resolução de análise.
       * Isso ajuda na leitura de códigos menores.
       */

      const scale = Math.min(
        1,
        1200 / video.videoWidth
      );

      const width = Math.max(
        1,
        Math.floor(video.videoWidth * scale)
      );

      const height = Math.max(
        1,
        Math.floor(video.videoHeight * scale)
      );

      canvas.width = width;
      canvas.height = height;

      ctx.drawImage(
        video,
        0,
        0,
        width,
        height
      );

      const image = ctx.getImageData(
        0,
        0,
        width,
        height
      );

      /*
       * LEITOR PRINCIPAL
       */

      const code = window.jsQR(
        image.data,
        width,
        height,
        {
          inversionAttempts: "attemptBoth"
        }
      );

      if (code && code.data) {

        const now = Date.now();

        if (
          code.data !== lastCode ||
          now - lastTime > 3000
        ) {

          lastCode = code.data;

          lastTime = now;

          console.log("QR Code identificado:", code.data);

          onScan(code.data);

        }

      }

    }

  } catch (error) {

    console.error(
      "Erro durante leitura do QR Code:",
      error
    );

    setStatus("Erro ao analisar imagem.");

  }

  if (scanning) {

    animationId = requestAnimationFrame(tick);

  }

}


/* =========================================
   8. TROCAR CÂMERA
========================================= */

async function switchCamera() {

  const wasRunning = Boolean(stream);

  facingMode =
    facingMode === "environment"
      ? "user"
      : "environment";

  if (wasRunning) {

    stopCamera();

    await startCamera();

  } else {

    setStatus(
      facingMode === "environment"
        ? "Câmera traseira selecionada"
        : "Câmera frontal selecionada"
    );

  }

}


/* =========================================
   9. GERAR QR CODE
========================================= */

function generateQRCode(text, box) {

  box.innerHTML = "";

  if (typeof window.QRCode !== "function") {

    box.style.display = "none";

    return;

  }

  new QRCode(box, {

    text: text,

    width: 200,

    height: 200,

    correctLevel: QRCode.CorrectLevel.M

  });

  box.style.display = "flex";

}


/* =========================================
   10. JANELA DE RESULTADO
========================================= */

function openModal({
  tag,
  warn,
  title,
  desc,
  link,
  qrText
}) {

  $("mTag").textContent = tag;

  $("mTag").className =
    "tag" + (warn ? " warn" : "");

  $("mTitle").textContent = title;

  $("mDesc").textContent = desc;

  currentLink = link || null;

  $("mOpen").style.display =
    link ? "" : "none";

  $("mQr").innerHTML = "";

  if (qrText) {

    generateQRCode(qrText, $("mQr"));

  } else {

    $("mQr").style.display = "none";

  }

  $("modalBg").classList.add("show");

  modalOpen = true;

  if (navigator.vibrate) {
    navigator.vibrate(60);
  }

}


function closeModal() {

  $("modalBg").classList.remove("show");

  modalOpen = false;

  lastTime = Date.now();

  setStatus("Procurando QR Code...");

}


/* =========================================
   11. RESULTADO DA LEITURA
========================================= */

function onScan(text) {

  const item = findItem(text);

  if (item) {

    openModal({

      tag: "Site reconhecido",

      title: item.titulo,

      desc: item.descricao,

      link: item.url

    });

  } else {

    const isUrl = /^https?:\/\//i.test(text);

    openModal({

      tag: "QR Code não cadastrado",

      warn: true,

      title: "Código não reconhecido",

      desc:
        "A leitura funcionou, mas este QR Code não corresponde ao cadastro da FATIPI. Conteúdo lido: " + text,

      link: isUrl ? text : null

    });

  }

}


/* =========================================
   12. ABRIR LINK
========================================= */

function abrirLink(url) {

  if (!url) return;

  window.open(
    url,
    "_blank",
    "noopener,noreferrer"
  );

}


/* =========================================
   13. BOTÕES
========================================= */

$("mClose").addEventListener(
  "click",
  closeModal
);

$("modalBg").addEventListener(
  "click",
  event => {

    if (event.target.id === "modalBg") {
      closeModal();
    }

  }
);

$("mOpen").addEventListener(
  "click",
  () => {

    if (currentLink) {
      abrirLink(currentLink);
    }

  }
);

$("btnStart").addEventListener(
  "click",
  startCamera
);

$("btnSwitch").addEventListener(
  "click",
  switchCamera
);

$("btnStop").addEventListener(
  "click",
  stopCamera
);


/* =========================================
   14. LISTA DE QR CODES
========================================= */

const list = $("list");

ITEMS.forEach(item => {

  const element = document.createElement("div");

  element.className = "item";

  const info = document.createElement("div");

  const title = document.createElement("b");

  const url = document.createElement("span");

  const button = document.createElement("button");

  title.textContent = item.titulo;

  url.textContent = item.url;

  button.type = "button";

  button.className = "ghost small";

  button.textContent = "Ver QR";

  button.addEventListener("click", () => {

    openModal({

      tag: "QR Code oficial",

      title: item.titulo,

      desc: item.descricao,

      link: item.url,

      qrText: item.url

    });

  });

  info.appendChild(title);

  info.appendChild(url);

  element.appendChild(info);

  element.appendChild(button);

  list.appendChild(element);

});


/* =========================================
   15. INICIALIZAÇÃO
========================================= */

window.addEventListener("load", () => {

  console.log(
    "Biblioteca jsQR:",
    typeof window.jsQR
  );

  if (typeof window.jsQR !== "function") {

    showOverlay(
      "Leitor não carregado",
      "A biblioteca jsQR não foi carregada. Verifique a conexão com a internet.",
      "Tentar novamente"
    );

    setStatus("Biblioteca indisponível");

  } else {

    startCamera();

  }

});


/* =========================================
   16. CICLO DE VIDA
========================================= */

document.addEventListener(
  "visibilitychange",
  () => {

    if (document.hidden) {

      stopCamera();

    } else if (!stream) {

      startCamera();

    }

  }
);

window.addEventListener(
  "pagehide",
  stopCamera
);

</script>

</body>
</html>
